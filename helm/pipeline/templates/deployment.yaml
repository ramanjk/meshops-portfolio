apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | quote }}
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.serviceAccount.name }}-prompts
  namespace: {{ .Values.namespace }}
data:
  pipeline-steward.system.md: |-
{{ .Files.Get "prompts/pipeline-steward.system.md" | indent 4 }}
  pipeline-steward.chat.md: |-
{{ .Files.Get "prompts/pipeline-steward.chat.md" | indent 4 }}
{{- if .Values.writeEnabled }}
  pipeline-steward.gated-write.chat.md: |-
{{ .Files.Get "prompts/pipeline-steward.gated-write.chat.md" | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.serviceAccount.name }}
    app.kubernetes.io/component: steward
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.serviceAccount.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.serviceAccount.name }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Values.serviceAccount.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "--no-sync", "python", "-m", "stewards.pipeline"]
          ports:
            - name: metrics
              containerPort: 9464
{{- if .Values.chat.enabled }}
            - name: http
              containerPort: {{ .Values.chat.port }}
{{- end }}
          env:
            - name: AZURE_OPENAI_ENDPOINT
              value: {{ .Values.env.azureOpenAiEndpoint | quote }}
            - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
              value: {{ .Values.env.azureOpenAiChatDeploymentName | quote }}
            - name: LANGFUSE_HOST
              value: {{ .Values.env.langfuseHost | quote }}
            - name: MLFLOW_TRACKING_URI
              value: {{ .Values.env.mlflowTrackingUri | quote }}
            - name: REGISTERED_MODEL_NAME
              value: {{ .Values.env.registeredModelName | quote }}
            # Loop mode: >0 keeps this Deployment pod Running, re-running a cycle
            # on this interval. Leave at 0 for the one-shot pattern.
            - name: RUN_INTERVAL_SECONDS
              value: {{ .Values.runIntervalSeconds | default 0 | quote }}
{{- if .Values.chat.enabled }}
            # Interactive chat server: serve the steward's persona over HTTP
            # instead of running observe cycles. Keeps the pod long-lived.
            - name: CHAT_ENABLED
              value: "true"
            - name: CHAT_PORT
              value: {{ .Values.chat.port | quote }}
{{- end }}
{{- if .Values.writeEnabled }}
            # Iteration 2: arm the gated-write HITL path. The steward gains the
            # non-mutating propose_promotion tool and the write-capable persona;
            # every actuation still passes the human gate (ADR-0011). The one
            # mutation is an MLflow stage transition of registeredModelName.
            - name: WRITE_ENABLED
              value: "true"
            - name: WRITE_PROPOSAL_TTL_SECONDS
              value: {{ .Values.writeProposalTtlSeconds | default 900 | quote }}
            - name: WRITE_APPROVAL_CHANNEL
              value: {{ .Values.writeApprovalChannel | quote }}
{{- if eq .Values.writeApprovalChannel "github_pr" }}
            # github_pr channel: MERGE=approve / CLOSE=reject. The gh CLI needs a
            # PAT (repo scope) — provide it via a Secret named 'github-token'.
            - name: GITHUB_REPO
              value: {{ .Values.github.repo | quote }}
            - name: GITHUB_BASE_BRANCH
              value: {{ .Values.github.baseBranch | quote }}
            - name: GITHUB_PROPOSALS_DIR
              value: {{ .Values.github.proposalsDir | quote }}
            - name: GITHUB_POLL_SECONDS
              value: {{ .Values.github.pollSeconds | quote }}
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            # gh needs a writable config/state dir; the root FS is read-only, so
            # point it (and XDG dirs) at the tmp emptyDir mounted at /tmp.
            - name: GH_CONFIG_DIR
              value: /tmp/gh
            - name: XDG_STATE_HOME
              value: /tmp
            - name: XDG_DATA_HOME
              value: /tmp
{{- end }}
{{- end }}
            # uv needs a writable cache dir; root FS is read-only, so point it
            # at the tmp emptyDir volume mounted below.
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            # Secrets from Key Vault CSI:
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceAccount.name }}-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceAccount.name }}-secrets
                  key: LANGFUSE_SECRET_KEY
          volumeMounts:
            - name: prompts
              mountPath: /etc/prompts
              readOnly: true
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- if .Values.chat.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
{{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: prompts
          configMap:
            name: {{ .Values.serviceAccount.name }}-prompts
        - name: tmp
          emptyDir: {}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.serviceAccount.name }}-kv
