image:
  repository: ""          # ${ACR_LOGIN_SERVER}/meshops/hello-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

namespace: meshops

# Run model for the Deployment. 0 = one-shot (pod completes and, under a
# Deployment, restarts). A positive value runs the steward as a long-lived loop
# so the pod stays Running. Ignored when chat.enabled is true.
runIntervalSeconds: 0

# Interactive chat interface. When enabled, the pod serves the Gateway Steward's
# persona over HTTP (with a minimal web UI at /) instead of running observe
# cycles, so you can talk to it and exercise its LiteLLM read tool.
chat:
  enabled: true
  port: 8080
  service:
    # ClusterIP (port-forward only) or LoadBalancer (Azure public LB).
    type: LoadBalancer
    annotations: {}
    # SECURITY: the chat endpoint has no auth. Restrict who can reach the public
    # IP by listing CIDRs here. Empty list = open to the internet.
    loadBalancerSourceRanges: []
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""

serviceAccount:
  name: hello-gateway
  # Workload Identity client ID — filled by Terraform output / install time.
  clientId: ""

# LiteLLM proxy — the Gateway Steward's read substrate (via litellm-mcp) and, in
# Iteration 2, the ConfigMap/Deployment the gated write targets.
litellm:
  # In-cluster base URL of the LiteLLM proxy the steward reads.
  baseUrl: "http://litellm.meshops-workloads.svc.cluster.local:4000"
  # The LiteLLM master key is delivered via the Key Vault CSI mount (same channel
  # as the Langfuse keys) as LITELLM_MASTER_KEY in <sa>-secrets. The KV secret
  # name is fixed in secretproviderclass.yaml (litellm-master-key).

# ---- Iteration 2: gated write (HITL) ----------------------------------------
# Master switch for the write scope. When false (default) the steward is exactly
# its read-only self: no propose_budget tool, read-only persona, and NO write
# RBAC is created. When true, the deployment gets WRITE_ENABLED + the gated-write
# persona, and a *namespaced, write-but-bounded* Role/RoleBinding is created in
# writeNamespace (templates/write-rbac.yaml) granting configmaps get/patch +
# deployments get/patch (to roll the proxy). The gate + human approval are always
# required regardless (ADR-0011).
writeEnabled: false
# The single namespace the steward's budget applier may mutate — where the
# LiteLLM ConfigMap + Deployment live. MUST match BUDGET_NAMESPACE (the app-level
# guard) — both are set from this value in deployment.yaml.
writeNamespace: meshops-workloads
# HITL approval channel (ADR-0011, pluggable on the same gate + executor + audit):
#   "chat"      -> synchronous Approve/Reject in the chat UI (default).
#   "github_pr" -> the steward opens a PR per proposal; MERGE = approve, CLOSE =
#                  reject. Requires github.* set and a GH_TOKEN (repo scope).
writeApprovalChannel: chat

# The domain guard bounds for the gated per-route budget-cap change. Enforced
# in-app BEFORE the gate stores a proposal (a violating request is denied, never
# approvable), with the namespaced writer RBAC Role as the hard backstop.
budget:
  # Name of the ConfigMap holding the LiteLLM config.yaml (in writeNamespace).
  configmap: litellm-config
  configKey: config.yaml
  # LiteLLM proxy Deployment to roll after a budget change so it reloads config.
  deployment: litellm
  # Comma-separated route (model_name) names the steward may re-budget. Empty =
  # any route present in the config (still RBAC-bounded to writeNamespace).
  allowedRoutes: ""
  minBudget: 0.0
  maxBudget: 1000.0

github:
  repo: ""                # owner/repo proposal PRs are opened against
  baseBranch: main
  proposalsDir: hitl-proposals
  pollSeconds: 20

keyVault:
  name: ""                # ${KV_NAME}, filled at helm install time
  tenantId: ""

env:
  azureOpenAiEndpoint: ""
  azureOpenAiChatDeploymentName: "gpt-4.1"
  langfuseHost: "http://langfuse-web.langfuse.svc.cluster.local:3000"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
