apiVersion: kaito.sh/v1beta1
kind: Workspace
metadata:
  name: lab-phi-4-mini-eus2-01
  namespace: meshops-workloads
resource:
  instanceType: "Standard_NC4as_T4_v3"
  count: 1
  labelSelector:
    matchLabels:
      apps: phi-4-mini
inference:
  preset:
    name: "phi-4-mini-instruct"
  # Override vLLM engine args (see extras/inference-config.yaml). Pins the
  # attention backend to TRITON_ATTN so the T4 does not try to JIT-compile the
  # FLASHINFER kernel with nvcc (absent from the KAITO preset image).
  config: "phi4-mini-inference-config"
