image:
  repository: ""          # ${ACR_LOGIN_SERVER}/meshops/hello-inference
  tag: "0.0.1"
  pullPolicy: IfNotPresent

namespace: meshops

# Run model for the Deployment. 0 = one-shot (pod completes and, under a
# Deployment, restarts — showing CrashLoopBackOff). A positive value runs the
# steward as a long-lived loop so the Deployment pod stays Running and re-runs a
# cycle on this interval. The CronJob (k8s/cronjob.yaml) leaves this at 0.
# Ignored when chat.enabled is true.
runIntervalSeconds: 0

# Interactive chat interface. When enabled, the pod serves the steward's persona
# over HTTP (with a minimal web UI at /) instead of running observe cycles, so
# you can talk to it and exercise its read-only tools. Keeps the pod Running.
chat:
  enabled: true
  port: 8080
  service:
    # ClusterIP (port-forward only) or LoadBalancer (Azure public LB, reachable
    # from your browser/WSL without port-forward).
    type: LoadBalancer
    annotations: {}
    # SECURITY: the chat endpoint has no auth. When type=LoadBalancer, restrict
    # who can reach the public IP by listing CIDRs here (e.g. your egress IPs).
    # Empty list = open to the internet.
    loadBalancerSourceRanges: []
  # Optional Ingress (set enabled=true and provide an ingress controller + host).
  # When used, prefer chat.service.type=ClusterIP and route through the Ingress.
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    # Optional TLS: set secretName to a pre-created cert Secret.
    tls:
      enabled: false
      secretName: ""

serviceAccount:
  name: hello-inference
  # Workload Identity client ID — filled by Terraform output
  clientId: ""

# ---- Iteration 2: gated write (HITL) ----------------------------------------
# Master switch for the write scope. When false (default) the steward is exactly
# its read-only self: no propose_write tool, read-only persona, and NO write
# RBAC is created. When true, the deployment gets WRITE_ENABLED + the gated-write
# persona, and a *namespaced, write-but-bounded* Role/RoleBinding is created in
# writeNamespace (see templates/write-rbac.yaml). The gate + human approval are
# always required regardless (ADR-0011).
writeEnabled: false
# The single namespace the steward's executor may mutate.
writeNamespace: meshops-workloads
# HITL approval channel (ADR-0011, pluggable on the same gate + executor + audit):
#   "chat"      -> synchronous Approve/Reject in the chat UI (default).
#   "github_pr" -> the steward opens a PR per proposal; MERGE = approve, CLOSE =
#                  reject. Requires writeApprovalChannel=github_pr + github.* set,
#                  and a GH_TOKEN (repo scope) available to the pod for the gh CLI.
writeApprovalChannel: chat
github:
  repo: ""                # owner/repo proposal PRs are opened against
  baseBranch: main
  proposalsDir: hitl-proposals
  pollSeconds: 20

keyVault:
  name: ""                # ${KV_NAME}, filled at helm install time
  tenantId: ""

env:
  azureOpenAiEndpoint: ""
  azureOpenAiChatDeploymentName: "gpt-4.1"
  langfuseHost: "http://langfuse-web.langfuse.svc.cluster.local:3000"
  aksResourceId: ""
  workspaceNamespace: "meshops-workloads"
  workspaceName: "lab-phi-4-mini-eus2-01"
  azureMonitorWorkspaceQueryUrl: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
