# Langfuse self-host — demo-grade values for the read-only iteration.
#
# Goal: the smallest footprint that boots langfuse-web in-cluster so the steward
# can push OTLP traces to it. NOT production-hardened: single replicas, in-cluster
# Postgres/Clickhouse/Redis, small PVCs. Delete between demos to stop disk billing
# (see 05_deployment_guide.md §5 "silent leaks").
#
# Chart: langfuse/langfuse (https://langfuse.github.io/langfuse-k8s)

langfuse:
  replicas: 1

  # SECRETS — sourced from the Kubernetes Secret `langfuse-secrets`, created by
  # `helm/langfuse/create-langfuse-secret.sh` (openssl-random hex; URL-safe so
  # the DB connection strings need no URL-encoding). No plaintext lives in git.
  nextauth:
    url: http://localhost:3000
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: nextauth-secret

  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: encryption-key

  # Worker (and any pod using the shared default) — modest footprint.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # The web pod runs Next.js 16, which needs more heap than the shared default.
  # Node caps its old-space to a fraction of the container limit, so we both
  # raise the memory limit AND lift the V8 heap ceiling via NODE_OPTIONS,
  # otherwise the server OOMs during startup ("Ineffective mark-compacts").
  web:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    pod:
      additionalEnv:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
        # Headless bootstrap: on first startup Langfuse creates this org,
        # project, user, and — crucially — an ingestion key pair with the exact
        # public/secret values below. That lets the deploy be fully scripted
        # (no manual "create project in the UI" click), and the same pk/sk are
        # written to Key Vault for the steward. Public/secret keys + the user
        # password come from the langfuse-secrets Secret, so nothing leaks to git.
        - name: LANGFUSE_INIT_ORG_ID
          value: "meshops"
        - name: LANGFUSE_INIT_ORG_NAME
          value: "MeshOps"
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "hello-inference"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "Hello Inference"
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: init-project-public-key
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: init-project-secret-key
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "ram@meshops.lab"
        - name: LANGFUSE_INIT_USER_NAME
          value: "Ram"
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: init-user-password

# --- In-cluster datastores (demo-grade single instances) ---------------------
postgresql:
  deploy: true
  auth:
    username: postgres
    existingSecret: langfuse-secrets
    secretKeys:
      userPasswordKey: postgres-password
      adminPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

clickhouse:
  deploy: true
  replicaCount: 1
  shards: 1
  auth:
    username: default
    existingSecret: langfuse-secrets
    existingSecretKey: clickhouse-password
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  # Single standalone node for the lab — no distributed cluster, no ZooKeeper.
  # The Langfuse app already runs with CLICKHOUSE_CLUSTER_ENABLED=false, so a
  # clustered ClickHouse (shards + keeper) only adds a coordination failure
  # surface that can leave the native 9000 port closed during startup.
  clusterEnabled: false
  zookeeper:
    enabled: false
  keeper:
    enabled: false

redis:
  deploy: true
  architecture: standalone
  auth:
    existingSecret: langfuse-secrets
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

# Bitnami S3-compatible object store (Langfuse event/media blobs).
s3:
  deploy: true
  auth:
    rootUser: "langfuse"
    existingSecret: langfuse-secrets
    rootUserSecretKey: minio-root-user
    rootPasswordSecretKey: minio-root-password
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
