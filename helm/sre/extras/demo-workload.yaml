# Demo workload the SRE Steward's Iteration-2 gated write targets.
#
# The SRE steward's one mutation is scaling a Deployment's replica count. This is
# a deliberately trivial, cheap workload (a paused busybox) in the bounded
# namespace so approve->act scale round-trips have a real, safe target — never
# the KAITO Workspace (whose resource.count is immutable) or a steward itself.
#
#   kubectl apply -f helm/sre/extras/demo-workload.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: meshops-workloads
  labels:
    app.kubernetes.io/name: demo-web
    app.kubernetes.io/component: sre-scale-demo
    meshops.io/purpose: sre-scale-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-web
    spec:
      containers:
        - name: pause
          image: mcr.microsoft.com/oss/kubernetes/pause:3.10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65535
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
