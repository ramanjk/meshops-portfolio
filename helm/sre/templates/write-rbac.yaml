{{- if .Values.writeEnabled }}
{{/*
Iteration 2 (ADR-0011) — the write-but-bounded RBAC backstop.

This is the HARD floor under the HITL gate. Even after a human approves, the
deterministic executor runs `kubectl` using this ServiceAccount's token, so an
approved-but-wrong (or prompt-injected) request is physically capped by what
this Role grants.

Deliberately bounded to the SRE steward's ONE gated write — Deployment scale:
  * It is a NAMESPACED Role in writeNamespace — it therefore CANNOT touch
    cluster-scoped resources (nodes, namespaces, CRDs, ClusterRoles, …) at all.
  * It grants exactly the surface `kubectl scale deployment/<x>` needs: read
    `deployments` (for the live replica-count preview) plus mutate the
    `deployments/scale` subresource. Nothing else — no pods, configmaps,
    statefulsets, or KAITO Workspaces.
  * It NEVER lists secrets or rbac.authorization.k8s.io objects — so the steward
    can neither read nor mutate credentials or escalate its own privileges.

This is the HARD floor that makes the defence-in-depth claim true: even an
approved-but-wrong (or prompt-injected) request is physically capped at scaling
a Deployment in writeNamespace. The read path is untouched: the broad read-only
`view` ClusterRoleBinding in rbac.yaml still applies. This Role only ADDS a
narrow, namespaced write surface.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccount.name }}-writer
  namespace: {{ .Values.writeNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.serviceAccount.name }}
    app.kubernetes.io/component: steward
    meshops.io/iteration: "2-gated-write"
rules:
  # Read the live Deployment to preview its current replica count.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # Scale the Deployment (the scale subresource backs `kubectl scale`) — the
  # steward's ONE gated write. No other verbs, resources, or apiGroups.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # NOTE: pods, configmaps, statefulsets, KAITO Workspaces, secrets,
  # rbac.authorization.k8s.io, and ALL cluster-scoped resources are
  # intentionally absent. A namespaced Role cannot grant the latter anyway.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccount.name }}-writer
  namespace: {{ .Values.writeNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.serviceAccount.name }}
    app.kubernetes.io/component: steward
    meshops.io/iteration: "2-gated-write"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.serviceAccount.name }}-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
{{- end }}
