[project]
name = "meshops"
version = "0.0.1"
description = "MeshOps — multi-agent mesh for AKS LLMOps/MLOps/AIOps/SecOps."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework==1.12.*",
    "agent-framework-openai==1.10.*",
    "mcp>=1.6,<2.0",
    "langfuse>=3.0,<4.0",
    "azure-identity>=1.20",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-exporter-prometheus>=0.51b0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
hello-inference = "stewards.inference.__main__:run"
prom-mcp = "mcp_servers.prom_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stewards", "src/mcp_servers"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
